name: Sync YouTube uploads

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-youtube.yml"

permissions:
  contents: write

concurrency:
  group: knowgura-youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YouTube feed reader
        run: python -m pip install --upgrade yt-dlp

      - name: Fetch latest public channel uploads
        env:
          YOUTUBE_CHANNEL_ID: "UCnY1x4Lg3coYJv2FG2Q8CuA"
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          channel_id = os.environ["YOUTUBE_CHANNEL_ID"]
          url = f"https://www.youtube.com/channel/{channel_id}/videos"
          result = subprocess.run(
              [
                  "yt-dlp",
                  "--flat-playlist",
                  "--dump-single-json",
                  "--playlist-end", "15",
                  "--no-warnings",
                  url
              ],
              check=True,
              capture_output=True,
              text=True,
              timeout=180
          )
          data = json.loads(result.stdout)
          entries = data.get("entries") or []
          videos = []
          for item in entries:
              video_id = item.get("id")
              title = item.get("title")
              if not video_id or not title:
                  continue
              upload_date = item.get("upload_date") or ""
              published = (
                  f"{upload_date[:4]}-{upload_date[4:6]}-{upload_date[6:8]}"
                  if len(upload_date) == 8 else ""
              )
              videos.append({
                  "id": video_id,
                  "title": title,
                  "description": item.get("description") or "A Knowgura documentary",
                  "published": published,
                  "category": "Latest upload · Knowgura"
              })

          if not videos:
              raise RuntimeError(
                  "yt-dlp returned no public videos for channel "
                  + channel_id
                  + "; the existing catalogue was left untouched."
              )

          Path("videos.json").write_text(
              json.dumps(videos[:15], ensure_ascii=False, indent=2) + chr(10),
              encoding="utf-8"
          )
          print(f"Prepared {len(videos[:15])} public Knowgura videos.")

      - name: Commit catalogue when it changes
        run: |
          if git diff --quiet -- videos.json; then
            echo "The video catalogue is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "Sync latest Knowgura YouTube uploads"
          git push

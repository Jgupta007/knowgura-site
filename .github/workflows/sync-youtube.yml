name: Sync YouTube uploads

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-youtube.yml"

permissions:
  contents: write

concurrency:
  group: knowgura-youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read latest public uploads from YouTube
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0 (compatible; KnowguraSite/1.0)"}
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read().decode("utf-8", "replace")

          def channel_id_from_page(page, kind):
              if kind == "video":
                  marker = page.find('"videoDetails"')
                  region = page[marker:marker + 6000] if marker >= 0 else page
                  match = re.search(r'"channelId"\\s*:\\s*"(UC[A-Za-z0-9_-]{22})"', region)
                  if match:
                      return match.group(1)
              else:
                  marker = page.find('"channelMetadataRenderer"')
                  region = page[marker:marker + 8000] if marker >= 0 else page
                  for pattern in (
                      r'"externalId"\\s*:\\s*"(UC[A-Za-z0-9_-]{22})"',
                      r'"channelId"\\s*:\\s*"(UC[A-Za-z0-9_-]{22})"',
                      r'itemprop=["\\']channelId["\\']\\s+content=["\\'](UC[A-Za-z0-9_-]{22})["\\']'
                  ):
                      match = re.search(pattern, region)
                      if match:
                          return match.group(1)
              return None

          sources = [
              ("channel", "https://www.youtube.com/@KnowguraTV"),
              ("video", "https://www.youtube.com/watch?v=c0FlK_MiQCE"),
              ("video", "https://www.youtube.com/watch?v=EoSKI39989w")
          ]
          candidate_ids = []
          for kind, url in sources:
              try:
                  page = fetch(url)
                  channel_id = channel_id_from_page(page, kind)
                  if channel_id and channel_id not in candidate_ids:
                      candidate_ids.append(channel_id)
                      print(f"Found channel ID {channel_id} from {kind} page.")
              except Exception as exc:
                  print(f"Could not inspect {kind} page {url}: {exc}")

          if not candidate_ids:
              raise RuntimeError("Could not identify the Knowgura channel ID from its public channel/videos.")

          atom = "{http://www.w3.org/2005/Atom}"
          yt = "{http://www.youtube.com/xml/schemas/2015}"
          media = "{http://search.yahoo.com/mrss/}"
          selected_videos = None
          selected_id = None

          for channel_id in candidate_ids:
              feed_url = "https://www.youtube.com/xml/feeds/videos.xml?channel_id=" + channel_id
              for attempt in range(3):
                  try:
                      xml_text = fetch(feed_url)
                      root = ET.fromstring(xml_text)
                      entries = root.findall(atom + "entry")
                      videos = []
                      for entry in entries:
                          video_id = entry.findtext(yt + "videoId")
                          title = entry.findtext(atom + "title")
                          if not video_id or not title:
                              continue
                          published = (entry.findtext(atom + "published") or "")[:10]
                          group = entry.find(media + "group")
                          description = group.findtext(media + "description") if group is not None else ""
                          videos.append({
                              "id": video_id,
                              "title": title,
                              "description": description or "A Knowgura documentary",
                              "published": published,
                              "category": "Latest upload · Knowgura"
                          })
                      if videos:
                          selected_videos = videos
                          selected_id = channel_id
                          break
                      print(f"Feed for {channel_id} returned no entries; trying the next candidate.")
                      break
                  except (urllib.error.URLError, ET.ParseError) as exc:
                      print(f"Feed attempt {attempt + 1} for {channel_id} failed: {exc}")
                      if attempt < 2:
                          time.sleep(5 * (attempt + 1))
              if selected_videos:
                  break

          if not selected_videos:
              raise RuntimeError(
                  "No public upload feed was found for the detected channel IDs: "
                  + ", ".join(candidate_ids)
                  + ". The existing catalogue was left untouched."
              )

          Path("videos.json").write_text(
              json.dumps(selected_videos[:15], ensure_ascii=False, indent=2) + chr(10),
              encoding="utf-8"
          )
          print(f"Prepared {min(len(selected_videos), 15)} Knowgura uploads from {selected_id}.")
          PY

      - name: Commit catalogue when it changes
        run: |
          if git diff --quiet -- videos.json; then
            echo "The video catalogue is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git commit -m "Sync latest Knowgura YouTube uploads"
          git push
